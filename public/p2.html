<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />

    <title>p2</title>
  </head>
  <body>
    <h1>welcome to p2</h1>
    <form id="form">
      <label for="name">用户名</label>
      <input id="name" name="theName" type="text" />
      <label for="avatar">头像(接受png、jpeg、pdf)</label>
      <input
        id="avatar"
        name="upload"
        type="file"
        accept="image/png,image/jpeg,application/pdf"
      />
      <button type="submit">上传</button>
    </form>
    <ul id="list"></ul>
    <button id="del">删除</button>
    <script src="/p2.js" type="module"></script>
  </body>
</html>
